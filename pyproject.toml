[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruskimaxxing-supertotal"
version = "2.3.1"
description = "Free 1-year supertotal program (squat, bench, deadlift, press, snatch, clean & jerk) with PR tracking: Excel plus Windows, macOS and Linux app."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pillow>=10"]

[project.scripts]
ruskimaxxing = "ruskimaxxing.cli:main"

[project.gui-scripts]
ruskimaxxing-app = "ruskimaxxing.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruskimaxxing = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---- Phone apps (BeeWare Briefcase): briefcase create/build/package android | iOS ----
[tool.briefcase]
project_name = "RuskiMaxxing Supertotal"
bundle = "io.github.andrewsdillondesign.supertotal"
version = "2.3.1"
url = "https://github.com/andrewsdillon-design/ruskimaxxingsupertotal"
license = "MIT"
license-files = ["LICENSE"]
author = "andrewsdillon-design"
author_email = "256809530+andrewsdillon-design@users.noreply.github.com"

[tool.briefcase.app.ruskimaxxing_mobile]
formal_name = "RuskiMaxxing Supertotal"
description = "Free 1-year supertotal program (incl. snatch and clean & jerk) with per-set logging and PR tracking."
sources = ["src/ruskimaxxing", "src/ruskimaxxing_mobile"]
icon = "src/ruskimaxxing_mobile/resources/icon"
requires = []

[tool.briefcase.app.ruskimaxxing_mobile.linux]
requires = ["toga-gtk~=0.5.6"]

[tool.briefcase.app.ruskimaxxing_mobile.android]
requires = ["toga-android~=0.5.6"]
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
build_gradle_dependencies = ["com.google.android.material:material:1.13.0"]
# after signing in on the website, "Return to the app" (ruskimaxxingsupertotal://) brings the running app back
android_manifest_activity_attrs_extra_content = 'android:launchMode="singleTask"'
android_manifest_activity_extra_content = """
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="ruskimaxxingsupertotal" />
            </intent-filter>"""

[tool.briefcase.app.ruskimaxxing_mobile.iOS]
requires = ["toga-iOS~=0.5.6"]
info.CFBundleURLTypes = [{ CFBundleURLName = "io.github.andrewsdillondesign.supertotal.ruskimaxxing_mobile", CFBundleURLSchemes = ["ruskimaxxingsupertotal"] }]
