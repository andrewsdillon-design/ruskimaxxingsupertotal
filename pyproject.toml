[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruskimaxxing-supertotal"
version = "2.1.0"
description = "Free 1-year supertotal program (squat, bench, deadlift, press, snatch, clean & jerk) with PR tracking: Excel plus Windows, macOS and Linux app."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pillow>=10"]

[project.scripts]
ruskimaxxing = "ruskimaxxing.cli:main"

[project.gui-scripts]
ruskimaxxing-app = "ruskimaxxing.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruskimaxxing = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
